name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "📝 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "🔧 Maintenance"
    labels:
      - "chore"
      - "refactor"
      - "dependencies"

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&' # escape characters in titles
version-resolver:
  major:
    labels:
      - "major"
      - "breaking-change"
  minor:
    labels:
      - "minor"
      - "feature"
  patch:
    labels:
      - "patch"
      - "bug"
      - "fix"
template: |
  ## Changes
  $CHANGES
