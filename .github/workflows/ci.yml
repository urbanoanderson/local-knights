name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build-and-test:
    needs: secret-scan
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for dev push workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const deadline = Date.now() + 45 * 60 * 1000;
            let run;

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                event: 'push',
                head_sha: process.env.HEAD_SHA,
                per_page: 10
              });
              run = response.data.workflow_runs
                .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];

              if (!run) {
                core.info(`Waiting for the dev push workflow for ${process.env.HEAD_SHA} to start.`);
              } else if (run.status !== 'completed') {
                core.info(`Waiting for dev push workflow run ${run.id}; current status: ${run.status}.`);
              } else if (run.conclusion !== 'success') {
                core.setFailed(`Dev push workflow run ${run.id} completed with conclusion: ${run.conclusion}.`);
                return;
              } else {
                core.info(`Dev push workflow run ${run.id} completed successfully.`);
                return;
              }

              await delay(15000);
            }

            core.setFailed(`Timed out waiting for the dev push workflow for ${process.env.HEAD_SHA}.`);

      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ProjectSolution.slnx -r win-x64

      - name: Build
        run: dotnet build ProjectSolution.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ProjectSolution.slnx --configuration Release --no-build --verbosity normal

  prerelease:
    if: github.event_name == 'push'
    needs:
      - secret-scan
      - build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path .\LocalKnights.WindowsDesktop\LocalKnights.WindowsDesktop.csproj -XPath "/Project/PropertyGroup/Version").Node.InnerText
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "The app version '$version' is not a supported numeric version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Ensure version is not already released
        uses: actions/github-script@v9
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          retries: 3
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const release = releases.find(item => item.tag_name === process.env.TAG);
            if (release && !release.prerelease) {
              core.setFailed(`${process.env.TAG} is already a stable release. Increment the app version before pushing to dev.`);
            }

      - name: Find previous stable release
        id: previous_release
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const previous = releases
              .filter(release => !release.draft && !release.prerelease)
              .sort((left, right) => new Date(right.published_at) - new Date(left.published_at))[0];
            core.setOutput('tag', previous?.tag_name ?? '');

      - name: Build pre-release notes
        shell: pwsh
        env:
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.tag }}
        run: |
          $range = if ($env:PREVIOUS_TAG) { "$env:PREVIOUS_TAG..HEAD" } else { "HEAD" }
          $commits = @(git log $range --no-merges --pretty=format:'%s%x09%h')
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to generate release notes from '$range'."
          }

          $categories = [ordered]@{
            feat = @{ Title = 'Features'; Items = [System.Collections.Generic.List[string]]::new() }
            fix = @{ Title = 'Fixes'; Items = [System.Collections.Generic.List[string]]::new() }
             refac = @{ Title = 'Refactors'; Items = [System.Collections.Generic.List[string]]::new() }
            docs = @{ Title = 'Documentation'; Items = [System.Collections.Generic.List[string]]::new() }
            other = @{ Title = 'Other Changes'; Items = [System.Collections.Generic.List[string]]::new() }
          }

          foreach ($commit in $commits) {
            $subject, $shortHash = $commit -split "`t", 2
             if ($subject -match '^(?<type>feat|fix|patch|refac|doc|docs):\s*(?<message>.+)$') {
              $type = $Matches.type.ToLowerInvariant()
              $category = switch ($type) {
                'patch' { 'fix' }
                'doc' { 'docs' }
                default { $type }
              }
              $message = $Matches.message.Trim()
            } else {
              $category = 'other'
              $message = $subject
            }
            $categories[$category].Items.Add("- $message (``$shortHash``)")
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.AddRange([string[]]@(
            '<!-- prerelease-warning:start -->'
            '> [!WARNING]'
            '> **Unstable pre-release.** This build is intended for testing and may contain incomplete or breaking changes. Do not use it for production club data.'
            '<!-- prerelease-warning:end -->'
            ''
            '## Changes'
          ))

          foreach ($category in $categories.Values) {
            if ($category.Items.Count -eq 0) { continue }
            $notes.Add('')
            $notes.Add("### $($category.Title)")
            $notes.AddRange([string[]]$category.Items)
          }

          if ($commits.Count -eq 0) {
            $notes.Add('')
            $notes.Add('- No user-facing changes.')
          }
          $notes | Set-Content -Path release-notes.md

      - name: Publish application
        run: dotnet publish .\LocalKnights.WindowsDesktop\LocalKnights.WindowsDesktop.csproj -c Release -r win-x64 --self-contained true -o out

      - name: Create zip artifact
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zipName = "LocalKnights-$env:VERSION-win-x64-prerelease.zip"
          Compress-Archive -Path out\* -DestinationPath $zipName
          "path=$zipName" >> $env:GITHUB_OUTPUT

      - name: Remove older pre-releases
        uses: actions/github-script@v9
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.version }}
        with:
          retries: 3
          script: |
            const parseVersion = value => {
              const match = value.replace(/^v/, '').match(/^(\d+(?:\.\d+){2,3})$/);
              return match ? match[1].split('.').map(Number) : null;
            };
            const compareVersions = (left, right) => {
              const length = Math.max(left.length, right.length);
              for (let index = 0; index < length; index++) {
                const difference = (left[index] ?? 0) - (right[index] ?? 0);
                if (difference !== 0) return difference;
              }
              return 0;
            };

            const currentVersion = parseVersion(process.env.CURRENT_VERSION);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const release of releases) {
              const releaseVersion = parseVersion(release.tag_name);
              if (!release.prerelease || !releaseVersion || compareVersions(releaseVersion, currentVersion) >= 0) continue;

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              core.info(`Deleted older pre-release ${release.tag_name}.`);
            }

      - name: Move pre-release tag to this commit
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --force $env:TAG $env:GITHUB_SHA
          git push --force origin "refs/tags/$env:TAG"

      - name: Create or update pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.package.outputs.path }}
        run: |
          $release = gh release view $env:TAG --json isPrerelease 2>$null | ConvertFrom-Json
          if ($release) {
            gh release edit $env:TAG --title "Local Knights $env:VERSION" --notes-file release-notes.md --prerelease --draft=false
          } else {
            gh release create $env:TAG --verify-tag --title "Local Knights $env:VERSION" --notes-file release-notes.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create or update the pre-release.' }
          gh release upload $env:TAG $env:ASSET --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload the pre-release asset.' }
