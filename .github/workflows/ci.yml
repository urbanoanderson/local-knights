name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Setup .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # your target version

      # Restore dependencies
      - name: Restore
        run: dotnet restore ProjectSolution.slnx -r win-x64

      # Build
      - name: Build
        run: dotnet build ProjectSolution.slnx --configuration Release --no-restore

      # Run unit tests
      - name: Test
        run: dotnet test ProjectSolution.slnx --configuration Release --no-build --verbosity normal
